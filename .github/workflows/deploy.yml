name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build the web app
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          CMS_SPACE_ID: ${{ vars.CMS_SPACE_ID }}
          CMS_TOKEN: ${{ secrets.CMS_TOKEN }}
          CMS_ENV: ${{ vars.CMS_ENV }}
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            "--dart-define=OMDB_KEY=$OMDB_KEY" \
            "--dart-define=CMS_SPACE_ID=$CMS_SPACE_ID" \
            "--dart-define=CMS_TOKEN=$CMS_TOKEN" \
            "--dart-define=CMS_ENV=$CMS_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
